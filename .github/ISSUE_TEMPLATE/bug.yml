name: 🐞 問題回報 / Bug report
description: 某個功能沒有照預期運作 / Something doesn't work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感謝回報！請**不要**上傳小說或圖片檔本身，貼出問題相關的幾行文字就好。
        Thanks! Please **don't** attach the novel or image files; paste just the relevant lines.
  - type: dropdown
    id: tool
    attributes:
      label: 工具 / Tool
      options:
        - 小說 TXT 轉 EPUB / Novel TXT to EPUB
        - 圖片轉 EPUB / Images to EPUB
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 發生什麼事？ / What happened?
      description: 你做了什麼、預期看到什麼、實際看到什麼。 / What you did, what you expected, what you got.
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 錯誤訊息 / Error message
      render: text
  - type: textarea
    id: sample
    attributes:
      label: 範例文字或正規表示式 / Sample lines or regex
      description: 例如被誤判的章節標題、使用的允許／封鎖清單。 / E.g. mis-split chapter titles and your allow/block lists.
      render: text
  - type: input
    id: env
    attributes:
      label: 瀏覽器與裝置 / Browser and device
      placeholder: Chrome 140, Windows 11 / Safari, iPhone
  - type: input
    id: reader
    attributes:
      label: 閱讀器（EPUB 顯示有問題時） / E-reader (for display problems)
      placeholder: Apple Books, Kobo, Calibre…
