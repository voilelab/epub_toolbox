name: Release

# 將 main 快轉到 release/<major>.x，打 tag 並部署 GitHub Pages
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. v1.2.3)
        required: true

permissions:
  contents: write
  actions: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release branch
        run: |
          [[ "$VERSION" =~ ^v([0-9]+)\.[0-9]+\.[0-9]+$ ]] || { echo "invalid version: $VERSION"; exit 1; }
          echo "BRANCH=release/${BASH_REMATCH[1]}.x" >> "$GITHUB_ENV"
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Check tag not exists
        run: |
          ! git rev-parse -q --verify "refs/tags/$VERSION" || { echo "tag exists: $VERSION"; exit 1; }
      # 只允許 fast-forward，release 分支有 main 沒有的 commit 時會失敗
      - name: Push main to release branch and tag
        run: |
          git tag "$VERSION"
          git push --atomic origin "HEAD:refs/heads/$BRANCH" "refs/tags/$VERSION"
      - name: Create GitHub Release
        run: gh release create "$VERSION" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
      # GITHUB_TOKEN 的 push 不會觸發 workflow，需手動 dispatch
      - name: Trigger Pages deploy
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$BRANCH"
